<div class="flex flex-col gap-3">
  <div class="flex flex-wrap items-center gap-3">
    <p class="m-0 min-w-0 flex-[1_1_220px] text-sm text-sobre-superficie-variante">{{ mensajes.subtitulo }}</p>
    @if (puedeEditar()) {
      <button matButton="tonal" type="button" data-accion="agregar-contacto" [disabled]="ocupado()" (click)="agregar()">
        <mat-icon aria-hidden="true">add</mat-icon>{{ mensajes.agregar }}
      </button>
    }
  </div>

  @if (error(); as mensajeError) {
    <p role="alert" class="m-0 rounded-tarjeta bg-contenedor-error p-3 text-sm text-sobre-contenedor-error" data-prueba="error">{{ mensajeError }}</p>
  }

  <vit-tabla [columnas]="columnas" [filas]="filas()" [total]="filas().length" [tamanosPagina]="tamanosPagina" [textoVacio]="mensajes.sinContactos">
    <ng-template vitCeldaTabla="principal" let-fila>
      @if (fila.contacto.principal) {
        <mat-icon class="vit-estrella-principal" aria-hidden="true">star</mat-icon>
        <span class="sr-only">{{ mensajes.principal }}</span>
      }
    </ng-template>

    @if (puedeEditar()) {
      <ng-template vitAccionesFila let-fila>
        <span class="flex justify-end">
          @if (!fila.contacto.principal) {
            <button
              mat-icon-button
              type="button"
              data-accion="marcar-principal"
              [disabled]="ocupado()"
              [attr.aria-label]="etiquetaAccion(mensajes.marcarPrincipal, fila)"
              [matTooltip]="mensajes.marcarPrincipal"
              (click)="marcarPrincipal(fila)"
            >
              <mat-icon>star_outline</mat-icon>
            </button>
          }
          <button
            mat-icon-button
            type="button"
            data-accion="editar-contacto"
            [disabled]="ocupado()"
            [attr.aria-label]="etiquetaAccion(mensajes.editar, fila)"
            [matTooltip]="mensajes.editar"
            (click)="editar(fila)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          @if (fila.borrable) {
            <button
              mat-icon-button
              type="button"
              class="vit-destructivo"
              data-accion="eliminar-contacto"
              [disabled]="ocupado()"
              [attr.aria-label]="etiquetaAccion(mensajes.eliminar, fila)"
              [matTooltip]="mensajes.eliminar"
              (click)="eliminar(fila)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          }
        </span>
      </ng-template>
    }
  </vit-tabla>
</div>
