<section class="flex flex-col gap-3 rounded-tarjeta border border-borde p-4" aria-labelledby="titulo-consumo-identidad" data-tarjeta="consumo-identidad">
  <h2 id="titulo-consumo-identidad" class="text-base font-medium">{{ mensajes.titulo }}</h2>

  @if (cargando()) {
    <vit-cargando />
  } @else if (vista(); as consumo) {
    <div class="flex flex-wrap items-center justify-between gap-2">
      <p class="text-sm text-sobre-superficie-variante" data-mes>{{ consumo.mes }} · {{ mensajes.plan }} {{ consumo.plan }}</p>
      <vit-chip-estado [texto]="consumo.estado" [tono]="consumo.tonoEstado" />
    </div>
    <mat-progress-bar mode="determinate" [class]="consumo.clasesBarra" [value]="consumo.porcentaje" [attr.aria-label]="mensajes.consumoDelMes" />
    <p class="text-lg font-medium tabular-nums" data-consultas>{{ consumo.consultas }}</p>
  } @else if (fallo()) {
    <p class="text-sm text-sobre-superficie-variante" data-error>{{ mensajes.errorCarga }}</p>
  }
</section>
