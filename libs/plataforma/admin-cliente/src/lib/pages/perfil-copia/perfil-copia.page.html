<section class="flex max-w-4xl flex-col gap-4">
  @if (origen(); as perfilOrigen) {
    <h1 class="text-2xl font-medium">{{ mensajes.tituloCopia(perfilOrigen.nombre) }}</h1>
  }

  @if (error(); as mensajeError) {
    <p role="alert" class="rounded-tarjeta bg-contenedor-error p-3 text-sm text-sobre-contenedor-error">{{ mensajeError }}</p>
  }

  @if (disponibles(); as roles) {
    <form class="flex flex-col gap-2" [formGroup]="grupo" (ngSubmit)="copiar()" novalidate>
      <vit-form-codigo-nombre [grupo]="grupo" />
      <vit-selector-roles [roles]="roles" [(seleccionados)]="seleccionados" />

      @if (faltanRoles() && seleccionados().size === 0) {
        <p role="alert" class="text-sm text-error" data-error="roles">{{ mensajes.seleccioneRol }}</p>
      }

      <vit-acciones-formulario [guardando]="guardando()" [textoGuardar]="mensajes.crear" (cancelar)="cancelar()" />
    </form>
  } @else if (!error()) {
    <vit-cargando />
  }
</section>
