<section class="flex flex-col gap-4">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-2xl font-medium">{{ mensajes.titulo }}</h1>
  </header>

  <div class="flex flex-wrap items-start gap-3">
    <mat-form-field class="w-full sm:w-72" subscriptSizing="dynamic">
      <mat-label>{{ mensajes.rango }}</mat-label>
      <mat-date-range-input [formGroup]="rango" [rangePicker]="calendarioRango">
        <input matStartDate formControlName="desde" [placeholder]="mensajes.desde" data-campo="desde" />
        <input matEndDate formControlName="hasta" [placeholder]="mensajes.hasta" data-campo="hasta" (dateChange)="cambiarRango()" />
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="calendarioRango" />
      <mat-date-range-picker #calendarioRango />
    </mat-form-field>

    <vit-filtros
      class="min-w-0 flex-1"
      [definiciones]="filtros"
      [placeholderBusqueda]="mensajes.buscarUsuario"
      [valorInicial]="valorInicialFiltros"
      (cambio)="filtrar($event)"
    />
  </div>

  @if (error(); as mensajeError) {
    <p role="alert" class="rounded-tarjeta bg-contenedor-error p-3 text-sm text-sobre-contenedor-error">{{ mensajeError }}</p>
  }

  <vit-tabla
    [columnas]="columnas"
    [filas]="listado().items"
    [total]="listado().total"
    [cargando]="cargando()"
    [indicePagina]="filtro().pagina - 1"
    [tamanoPagina]="filtro().tamano"
    [textoVacio]="mensajes.sinEventos"
    (pagina)="paginar($event)"
  >
    <ng-template vitAccionesFila let-evento>
      <a mat-icon-button [routerLink]="evento.id" [attr.aria-label]="mensajes.verDetalle + ': ' + evento.tipo + ', ' + evento.fecha">
        <mat-icon aria-hidden="true">chevron_right</mat-icon>
      </a>
    </ng-template>
  </vit-tabla>
</section>
