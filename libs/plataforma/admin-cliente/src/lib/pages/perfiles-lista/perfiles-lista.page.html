<section class="flex flex-col gap-4">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-2xl font-medium">{{ mensajes.tituloPerfiles }}</h1>
    <a mat-flat-button routerLink="nuevo" data-accion="nuevo">
      <mat-icon aria-hidden="true">add</mat-icon>
      {{ mensajes.nuevoPerfil }}
    </a>
  </header>

  <vit-filtros [definiciones]="filtros" [placeholderBusqueda]="mensajes.buscarPerfil" (cambio)="filtrar($event)" />

  @if (error(); as mensajeError) {
    <p role="alert" class="rounded-tarjeta bg-contenedor-error p-3 text-sm text-sobre-contenedor-error">{{ mensajeError }}</p>
  }

  <vit-tabla
    [columnas]="columnas"
    [filas]="filasVisibles()"
    [total]="filas().length"
    [cargando]="cargando()"
    [indicePagina]="paginaActual().indice"
    [tamanoPagina]="paginaActual().tamano"
    [textoVacio]="mensajes.sinPerfiles"
    (pagina)="paginar($event)"
  >
    <ng-template vitAccionesFila let-perfil>
      <a mat-icon-button [routerLink]="perfil.id" [attr.aria-label]="verDetalle + ': ' + perfil.nombre">
        <mat-icon aria-hidden="true">chevron_right</mat-icon>
      </a>
    </ng-template>
  </vit-tabla>
</section>
