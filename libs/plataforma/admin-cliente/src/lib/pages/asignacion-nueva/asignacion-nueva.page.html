<section class="flex max-w-2xl flex-col gap-4">
  <h1 class="text-2xl font-medium">{{ mensajes.tituloAsignar }}</h1>

  @if (error(); as mensajeError) {
    <p role="alert" class="rounded-tarjeta bg-contenedor-error p-3 text-sm text-sobre-contenedor-error">{{ mensajeError }}</p>
  }

  @if (asignables(); as opciones) {
    <form class="flex flex-col" [formGroup]="grupo" (ngSubmit)="asignar()" novalidate>
      <vit-form-asignacion [grupo]="grupo" [asignables]="opciones" />
      <vit-acciones-formulario [guardando]="guardando()" [textoGuardar]="mensajes.asignar" (cancelar)="cancelar()" />
    </form>
  } @else if (!error()) {
    <vit-cargando />
  }
</section>
