@if (nodos().length === 0) {
  <vit-estado-vacio [icono]="iconoSinOpciones" [titulo]="mensajes.sinOpcionesMenu" />
} @else {
  <nav [attr.aria-label]="mensajes.menuPrincipal">
    <ng-container *ngTemplateOutlet="nivelDelMenu; context: { $implicit: nodos(), nivel: 0 }" />
  </nav>
}

<ng-template #nivelDelMenu let-nodosDelNivel let-nivel="nivel">
  <mat-nav-list [style.padding-inline-start.rem]="nivel">
    @for (nodo of nodosDelNivel; track nodo.codigo) {
      @if (nodo.hijos.length > 0) {
        <button mat-list-item type="button" [attr.aria-expanded]="estaExpandido(nodo.codigo)" (click)="alternar(nodo.codigo)">
          <mat-icon matListItemIcon aria-hidden="true">{{ nodo.icono }}</mat-icon>
          <span matListItemTitle>{{ nodo.nombre }}</span>
          <mat-icon matListItemMeta aria-hidden="true">{{ estaExpandido(nodo.codigo) ? 'expand_less' : 'expand_more' }}</mat-icon>
        </button>
        @if (estaExpandido(nodo.codigo)) {
          <ng-container *ngTemplateOutlet="nivelDelMenu; context: { $implicit: nodo.hijos, nivel: nivel + 1 }" />
        }
      } @else {
        <a
          mat-list-item
          [routerLink]="nodo.ruta"
          routerLinkActive
          #enlace="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: esRutaExacta(nodo.ruta) }"
          ariaCurrentWhenActive="page"
          [activated]="enlace.isActive"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ nodo.icono }}</mat-icon>
          <span matListItemTitle>{{ nodo.nombre }}</span>
        </a>
      }
    }
  </mat-nav-list>
</ng-template>
