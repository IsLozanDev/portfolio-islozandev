@if (sucursales().length > 1) {
  <button
    mat-button
    type="button"
    [matMenuTriggerFor]="menuDeSucursales"
    [disabled]="cambiando()"
    [attr.aria-label]="mensajes.sucursalActual + ': ' + (actual()?.nombre ?? '')"
  >
    <mat-icon aria-hidden="true">store</mat-icon>
    <span class="inline-block max-w-32 truncate align-middle sm:max-w-48">{{ actual()?.nombre }}</span>
    <mat-icon iconPositionEnd aria-hidden="true">arrow_drop_down</mat-icon>
  </button>

  <mat-menu #menuDeSucursales="matMenu">
    @for (sucursal of sucursales(); track sucursal.id) {
      <button mat-menu-item type="button" [attr.aria-current]="sucursal.id === actual()?.id ? 'true' : null" (click)="elegir(sucursal)">
        <mat-icon aria-hidden="true">{{ sucursal.id === actual()?.id ? 'check' : 'store' }}</mat-icon>
        <span>{{ sucursal.nombre }}</span>
      </button>
    }
  </mat-menu>
} @else if (actual(); as unica) {
  <span class="inline-flex items-center gap-1 text-sm" [attr.aria-label]="mensajes.sucursalActual + ': ' + unica.nombre">
    <mat-icon aria-hidden="true">store</mat-icon>
    <span class="max-w-32 truncate sm:max-w-48">{{ unica.nombre }}</span>
  </span>
}
