<!-- Ancho por la variable de Material: una clase de ancho de Tailwind pierde contra su CSS, que carga después. -->
<mat-sidenav-container class="h-dvh [--mat-sidenav-container-width:18rem]">
  <mat-sidenav #menuLateralRef [mode]="escritorio() ? 'side' : 'over'" [opened]="escritorio()">
    <vit-menu-lateral [nodos]="menu()" />
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col">
    <header class="sticky top-0 z-10">
      <mat-toolbar class="gap-2">
        @if (!escritorio()) {
          <button mat-icon-button type="button" [attr.aria-label]="mensajes.abrirMenu" (click)="menuLateralRef.toggle()">
            <mat-icon aria-hidden="true">menu</mat-icon>
          </button>
        }
        <span class="truncate text-lg">{{ nombreApp }}</span>
        <span class="flex-1"></span>
        @if (volverA(); as destino) {
          <!-- A menos de 768 px solo el ícono: el texto no cabe junto al selector. El span oculta: el CSS de mat-button le gana a `hidden`. -->
          <span class="hidden md:inline">
            <a mat-button [href]="destino.url" data-accion="volver-a">
              <mat-icon aria-hidden="true">arrow_back</mat-icon>
              {{ mensajeVolverA(destino.nombreApp) }}
            </a>
          </span>
          <span class="md:hidden">
            <a mat-icon-button [href]="destino.url" [attr.aria-label]="mensajeVolverA(destino.nombreApp)" data-accion="volver-a-icono">
              <mat-icon aria-hidden="true">arrow_back</mat-icon>
            </a>
          </span>
        }
        <vit-selector-sucursal />
        <vit-menu-usuario />
      </mat-toolbar>
    </header>

    <main class="flex-1 p-4">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
