<button mat-icon-button type="button" [matMenuTriggerFor]="menuDeUsuario" [attr.aria-label]="mensajes.menuUsuario">
  @if (inicial(); as letra) {
    <span class="flex size-8 items-center justify-center rounded-full bg-chip-exito text-sm font-medium text-sobre-chip-exito" aria-hidden="true">{{ letra }}</span>
  } @else {
    <mat-icon aria-hidden="true">account_circle</mat-icon>
  }
</button>

<mat-menu #menuDeUsuario="matMenu" xPosition="before">
  <p class="max-w-64 truncate px-4 py-2 text-sm text-sobre-superficie-variante">{{ correo() }}</p>
  <button mat-menu-item type="button" (click)="salir()">
    <mat-icon aria-hidden="true">logout</mat-icon>
    <span>{{ mensajes.salir }}</span>
  </button>
</mat-menu>
