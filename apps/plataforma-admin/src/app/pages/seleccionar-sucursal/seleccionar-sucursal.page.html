<main class="mx-auto flex min-h-screen w-full max-w-sm flex-col justify-center gap-4 p-4">
  <h1 class="text-2xl font-medium">Elija su sucursal</h1>

  @if (error(); as mensaje) {
    <p role="alert" class="rounded-md bg-(--mat-sys-error-container) p-3 text-sm text-(--mat-sys-on-error-container)">{{ mensaje }}</p>
  }

  @if (sucursales(); as lista) {
    <ul class="flex flex-col gap-2" aria-label="Sucursales accesibles">
      @for (sucursal of lista; track sucursal.id) {
        <li>
          <button
            class="w-full"
            type="button"
            [matButton]="sucursal.id === sucursalActual() ? 'filled' : 'outlined'"
            [attr.aria-current]="sucursal.id === sucursalActual() ? 'true' : null"
            [disabled]="eligiendo() !== null"
            (click)="elegir(sucursal.id)"
          >
            {{ sucursal.nombre }}
          </button>
        </li>
      }
    </ul>
  } @else if (!error()) {
    <div class="flex items-center gap-3" role="status">
      <mat-progress-spinner mode="indeterminate" diameter="24" aria-hidden="true" />
      Cargando sus sucursales…
    </div>
  }
</main>
