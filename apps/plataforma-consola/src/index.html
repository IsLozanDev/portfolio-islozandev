<!DOCTYPE html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <title>Consola de plataforma</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var tema;
        try { tema = localStorage.getItem('vitrina.tema'); } catch (error) {}
        if (tema !== 'claro' && tema !== 'oscuro') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        document.documentElement.setAttribute('data-tema', tema);
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet" />
  </head>
  <body>
    <vit-root></vit-root>
  </body>
</html>
