name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nx:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Caché de permisos de seguridad (spec 06): sus pruebas de integración usan Redis real.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Antivirus de TR-ARC (spec 34): las pruebas del adaptador real hablan con clamd por TCP. Etiqueta de versión
      # menor fijada, nunca latest. El entrypoint de la imagen escribe en clamd.conf cada variable CLAMD_CONF_<Opción>:
      # los tres límites quedan por encima de los 25 MB del bucket.
      clamav:
        image: clamav/clamav:1.5
        env:
          CLAMD_CONF_StreamMaxLength: 30M
          CLAMD_CONF_MaxFileSize: 30M
          CLAMD_CONF_MaxScanSize: 30M
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s
    env:
      # Las pruebas de integración crean bases temporales solo si existe TEST_DATABASE_URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      # Sin CLAMAV_HOST las pruebas con clamd real se saltan (describeConClamav).
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'push'
      # En un PR, nx-set-shas tomaba como base la cabeza del propio PR y no corría nada. El checkout es el
      # merge con la rama base: HEAD^1 es esa rama y el diff es exactamente el del PR.
      - name: Base del PR
        if: github.event_name == 'pull_request'
        run: |
          echo "NX_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # clamd tarda en cargar las firmas. Tope de 5 minutos: 60 intentos cada 5 s.
      - name: Comprobar y esperar clamd
        run: |
          limites=$(docker exec "${{ job.services.clamav.id }}" grep -cE '^(StreamMaxLength|MaxFileSize|MaxScanSize) 30M$' /etc/clamav/clamd.conf)
          if [ "$limites" != "3" ]; then
            echo "clamd.conf no tiene los tres límites en 30M"
            exit 1
          fi
          for intento in $(seq 1 60); do
            if exec 3<>/dev/tcp/localhost/3310 && printf 'zPING\0' >&3 && read -r -d '' -t 5 respuesta <&3 && [ "$respuesta" = "PONG" ]; then
              echo "clamd listo (intento $intento)"
              exit 0
            fi
            sleep 5
          done
          echo "clamd no respondió PONG en 5 minutos"
          exit 1
      - run: pnpm nx affected -t lint test build

  # TR-RNF-113 (spec 21): en un PR, solo sus commits; en main, todo el historial. Reglas y excepción en .gitleaks.toml.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Imagen oficial y no gitleaks-action: la acción pide licencia en repos de organización.
      # GIT_CONFIG_*: el repo montado es de otro usuario y git lo rechazaría por «dubious ownership».
      - name: gitleaks
        env:
          RANGO: ${{ github.event_name == 'pull_request' && format('--log-opts={0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner ${RANGO:+"$RANGO"}

  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitrina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitrina"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vitrina
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migraciones arriba
        run: pnpm db:up
      - name: Migraciones abajo
        run: pnpm db:down
      - name: Migraciones arriba otra vez
        run: pnpm db:up
