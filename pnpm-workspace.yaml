packages:
  - apps/*
  - libs/*/*
  - tools/*

allowBuilds:
  nx: true
  supabase: true
  "@parcel/watcher": false
  unrs-resolver: false
  "@scarf/scarf": false

minimumReleaseAgeExclude:
  - "@nestjs/common@12.2.0"
  - "@nestjs/core@12.2.0"
  - "@nestjs/platform-express@12.2.0"
  - "@nestjs/testing@12.2.0"
